# =============================================================================
# UniSOC Sentinel — Enterprise UniFi SIEM Platform
# docker-compose.yml — Production Infrastructure Stack
# =============================================================================

version: "3.9"

# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  opensearch_password:
    file: ./secrets/opensearch_password
  smtp_password:
    file: ./secrets/smtp_password
  jwt_secret:
    file: ./secrets/jwt_secret

# ---------------------------------------------------------------------------
# Named Volumes
# ---------------------------------------------------------------------------
volumes:
  opensearch-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  tls-certs:
    driver: local
  geoip-data:
    driver: local
  siem-logs:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  siem-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.0.0/24
  siem-public:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # -------------------------------------------------------------------------
  # Redis — In-memory data store, streams, pub/sub
  # -------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: >
      sh -c 'redis-server
        --requirepass "$$(cat /run/secrets/redis_password)"
        --appendonly yes
        --appendfsync everysec
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --loglevel notice'
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks:
      - siem-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m

  # -------------------------------------------------------------------------
  # PostgreSQL — Relational DB for users, sessions, alerts, audit
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: siem
      POSTGRES_DB: siem
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - siem-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siem -d siem"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m

  # -------------------------------------------------------------------------
  # OpenSearch — Log indexing and full-text search
  # -------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    restart: unless-stopped
    environment:
      cluster.name: siem-cluster
      node.name: siem-node-1
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-ChangeMe_1234!}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - siem-internal
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          curl -sf
          -u "admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-ChangeMe_1234!}"
          http://localhost:9200/_cluster/health
          | grep -qE '"status":"(green|yellow)"'
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g

  # -------------------------------------------------------------------------
  # TLS Manager — Provisions self-signed or Let's Encrypt certificates
  # -------------------------------------------------------------------------
  tls-manager:
    build: ./services/tls-manager
    restart: "no"
    environment:
      TLS_MODE: ${TLS_MODE:-self-signed}
      DOMAIN: ${DOMAIN:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@localhost}
    volumes:
      - tls-certs:/certs
    networks:
      - siem-public
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # Syslog Ingestion — Receives UniFi UDP syslog, publishes to Redis stream
  # -------------------------------------------------------------------------
  syslog-ingestion:
    build: ./services/syslog-ingestion
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "514"
      BUFFER_SIZE: ${SYSLOG_BUFFER_SIZE:-10000}
      WORKER_COUNT: ${SYSLOG_WORKERS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_PORT: "8081"
    secrets:
      - redis_password
    ports:
      - "${SYSLOG_BIND_HOST:-0.0.0.0}:514:514/udp"
    networks:
      - siem-internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    user: "1000:1000"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m

  # -------------------------------------------------------------------------
  # Parser Pipeline — Consumes raw logs, normalises, enriches, indexes
  # -------------------------------------------------------------------------
  parser-pipeline:
    build: ./services/parser-pipeline
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_USER: admin
      OPENSEARCH_PASSWORD_FILE: /run/secrets/opensearch_password
      GEOIP_DB_PATH: /data/geoip/GeoLite2-City.mmdb
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      WORKER_COUNT: ${PARSER_WORKERS:-2}
      BATCH_SIZE: ${PARSER_BATCH_SIZE:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_PORT: "8082"
    secrets:
      - redis_password
      - opensearch_password
    volumes:
      - geoip-data:/data/geoip
      - ./config/threat-intel:/data/threat-intel:ro
    networks:
      - siem-internal
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m

  # -------------------------------------------------------------------------
  # SIEM Core — FastAPI REST + WebSocket backend
  # -------------------------------------------------------------------------
  siem-core:
    build: ./services/siem-core
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: siem
      POSTGRES_DB: siem
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_USER: admin
      OPENSEARCH_PASSWORD_FILE: /run/secrets/opensearch_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,https://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKERS: ${SIEM_CORE_WORKERS:-4}
    secrets:
      - postgres_password
      - redis_password
      - opensearch_password
      - jwt_secret
    networks:
      - siem-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m

  # -------------------------------------------------------------------------
  # Alerting Engine — Evaluates rules against parsed logs, fires alerts
  # -------------------------------------------------------------------------
  alerting-engine:
    build: ./services/alerting-engine
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: siem
      POSTGRES_DB: siem
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      RULES_PATH: /config/alert-rules.yml
      DEDUP_TTL: ${ALERT_DEDUP_TTL:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_PORT: "8083"
    secrets:
      - redis_password
      - postgres_password
    volumes:
      - ./config/alert-rules/alert-rules.yml:/config/alert-rules.yml:ro
    networks:
      - siem-internal
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m

  # -------------------------------------------------------------------------
  # Email Notifier — Subscribes to Redis pub/sub, sends SMTP alerts
  # -------------------------------------------------------------------------
  email-notifier:
    build: ./services/email-notifier
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_FROM: ${SMTP_FROM:-siem@localhost}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      ALERT_RECIPIENTS: ${ALERT_RECIPIENTS:-admin@localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_PORT: "8084"
    secrets:
      - redis_password
      - smtp_password
    networks:
      - siem-internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128m

  # -------------------------------------------------------------------------
  # Dashboard UI — React/Vite SPA served via nginx
  # -------------------------------------------------------------------------
  dashboard-ui:
    build: ./services/dashboard-ui
    restart: unless-stopped
    networks:
      - siem-internal
    depends_on:
      - siem-core
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    user: "101:101"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=8m,mode=0755
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128m

  # -------------------------------------------------------------------------
  # Reverse Proxy — nginx TLS termination, routing, access logging
  # -------------------------------------------------------------------------
  reverse-proxy:
    build: ./services/reverse-proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - tls-certs:/etc/nginx/certs:ro
      - siem-logs:/var/log/nginx
    networks:
      - siem-internal
      - siem-public
    depends_on:
      tls-manager:
        condition: service_completed_successfully
      siem-core:
        condition: service_healthy
      dashboard-ui:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=128m,mode=0755
      - /var/run:size=8m,mode=0755
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128m

  # -------------------------------------------------------------------------
  # Prometheus — Metrics collection and storage
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./services/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - siem-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m

  # -------------------------------------------------------------------------
  # Grafana — Metrics visualisation and dashboards
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./services/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - siem-internal
      - siem-public
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    user: "472:472"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
